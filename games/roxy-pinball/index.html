<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07040f" />
    <meta
      name="description"
      content="Roxy Pinball - a 3D pinball table starring Roxy the golden retriever, with six missions, real ball physics and a squirrel."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Roxy Pinball</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #07040f;
        color: #f4ecff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        /* The table is played with the thumbs; nothing here should ever scroll,
           zoom or select under them. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: #b9a8d8;
        font-size: 15px;
      }

      #boot.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p id="boot">Waking Roxy&hellip;</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
