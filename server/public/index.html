<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roxy Run leaderboard API</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 100% at 50% 0%, #2a1b4a 0%, #0b0715 70%);
        color: #f4ecff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.55;
      }
      main { width: min(620px, 100%); }
      h1 { font-size: clamp(24px, 6vw, 34px); color: #ffd88a; margin-bottom: 6px; }
      p { color: #b9a8d8; margin-bottom: 18px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #1b1030;
        border: 1px solid #402a6b;
        border-radius: 8px;
        padding: 2px 7px;
        font-size: 14px;
        color: #f4ecff;
      }
      ul { list-style: none; display: grid; gap: 10px; margin-bottom: 22px; }
      a { color: #ffd88a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Roxy Run leaderboard</h1>
      <p>The backend behind the game's world board. Nothing to play here.</p>
      <ul>
        <li><code>GET /api/leaderboard?level=w1-1&amp;limit=10</code> — the top runs on a level</li>
        <li><code>POST /api/leaderboard</code> — post a run</li>
        <li><code>GET /api/health</code> — whether a database is attached</li>
      </ul>
      <p><a href="https://raemone.github.io/Games/roxy-run/">Play Roxy Run →</a></p>
    </main>
  </body>
</html>
