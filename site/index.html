<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Games</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 100% at 50% 0%, #2a1b4a 0%, #0b0715 70%);
        color: #f4ecff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(560px, 100%); text-align: center; }
      h1 { font-size: clamp(28px, 8vw, 44px); letter-spacing: 0.04em; margin-bottom: 8px; }
      p.sub { color: #b9a8d8; margin-bottom: 32px; }
      a.card {
        display: block;
        padding: 22px 24px;
        border-radius: 16px;
        background: #1b1030;
        border: 2px solid #402a6b;
        color: inherit;
        text-decoration: none;
        text-align: left;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: #ffd88a; }
      a.card h2 { font-size: 22px; margin-bottom: 6px; color: #ffd88a; }
      a.card span { color: #b9a8d8; font-size: 15px; }
      .cards { display: grid; gap: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Games</h1>
      <p class="sub">Little browser things. Best on a phone or tablet.</p>
      <div class="cards">
        <a class="card" href="./roxy-run/">
          <h2>🐕 Roxy Run</h2>
          <span>A pixel platformer starring Roxy the golden retriever. Run, roll and jump through three worlds.</span>
        </a>
        <a class="card" href="./poop-patrol/">
          <h2>💩 Poop Patrol</h2>
          <span>Track who picked up after Roxy in the backyard. Points, streaks and a weekly family leaderboard.</span>
        </a>
      </div>
    </main>
  </body>
</html>
