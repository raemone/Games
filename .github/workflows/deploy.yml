name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            games/roxy-run/package-lock.json
            games/poop-patrol/package-lock.json

      - name: Install (roxy-run)
        working-directory: games/roxy-run
        run: npm ci

      - name: Test (roxy-run)
        working-directory: games/roxy-run
        run: npm test

      - name: Build (roxy-run)
        working-directory: games/roxy-run
        run: npm run build

      - name: Install (poop-patrol)
        working-directory: games/poop-patrol
        run: npm ci

      - name: Test (poop-patrol)
        working-directory: games/poop-patrol
        run: npm test

      - name: Build (poop-patrol)
        working-directory: games/poop-patrol
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r games/roxy-run/dist _site/roxy-run
          cp -r games/poop-patrol/dist _site/poop-patrol

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
