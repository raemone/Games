name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            games/roxy-run/package-lock.json
            games/poop-patrol/package-lock.json
            server/package-lock.json

      - name: Install (roxy-run)
        working-directory: games/roxy-run
        run: npm ci

      - name: Test (roxy-run)
        working-directory: games/roxy-run
        run: npm test

      - name: Build (roxy-run)
        working-directory: games/roxy-run
        run: npm run build
        env:
          # An override, not a switch: unset, this arrives as an empty string
          # and the build falls back to the family's own board. Set it to "off"
          # for a fork that wants no backend at all.
          VITE_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}

      - name: Install (poop-patrol)
        working-directory: games/poop-patrol
        run: npm ci

      - name: Test (poop-patrol)
        working-directory: games/poop-patrol
        run: npm test

      - name: Build (poop-patrol)
        working-directory: games/poop-patrol
        run: npm run build

      # The leaderboard API deploys from Vercel, not from here, but its tests
      # guard the level table the game shares with it - so a level added to the
      # game and not to the server fails this build rather than production.
      - name: Install (server)
        working-directory: server
        run: npm ci

      - name: Test (server)
        working-directory: server
        run: npm test

      - name: Type-check (server)
        working-directory: server
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r games/roxy-run/dist _site/roxy-run
          cp -r games/poop-patrol/dist _site/poop-patrol

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
